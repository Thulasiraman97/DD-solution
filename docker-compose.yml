version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:80"
    environment:
      - DB_HOST=db
      - DB_NAME=ddsolutions
      - DB_USER=root
      - DB_PASS=root_password
    depends_on:
      - db
    volumes:
      - .:/var/www/html
    networks:
      - app-network

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=ddsolutions
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      # Automatically import database.sql on first startup
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
